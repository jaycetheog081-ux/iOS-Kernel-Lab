name: Second-Pass GPU and Firmware Analysis

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused-analysis:
    name: Analyze GPU and Firmware Leads
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate latest successful kernel analysis
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(
            gh run list \
              --repo "$GH_REPO" \
              --workflow analyze-kernelcache.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "No successful analyze-kernelcache.yml run was found."
            exit 1
          fi

          echo "Using kernel-analysis run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download kernel strings artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p input

          gh run download "$RUN_ID" \
            --repo "$GH_REPO" \
            --name ios-kernel-static-analysis \
            --dir input

          STRINGS_FILE="$(find input -type f \
            -name kernel-strings.txt -print -quit)"

          if [ -z "$STRINGS_FILE" ]; then
            echo "kernel-strings.txt was not found."
            find input -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Using kernel strings: $STRINGS_FILE"
          wc -l "$STRINGS_FILE"

          echo "STRINGS_FILE=$STRINGS_FILE" >> "$GITHUB_ENV"

      - name: Generate focused report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          source = Path(os.environ["STRINGS_FILE"])
          output = Path("reports/second-pass-gpu-firmware.txt")
          output.parent.mkdir(parents=True, exist_ok=True)

          lines = source.read_text(errors="replace").splitlines()

          categories = {
              "GPU firmware and ring-buffer handling": [
                  r"AGXFirmwareRingValidator",
                  r"AGXArmFirmwareMapper",
                  r"AGXAcceleratorRing",
                  r"AGXSecureGart",
                  r"ring.{0,35}(?:index|buffer|overflow|bounds|range)",
                  r"(?:index|buffer|overflow|bounds|range).{0,35}ring",
                  r"(?:GPU|AGX).{0,50}(?:mapping|bounds|overflow|length)",
                  r"(?:mapping|bounds|overflow|length).{0,50}(?:GPU|AGX)",
              ],
              "Firmware-update user clients": [
                  r"AppleFirmwareUpdateUserClient",
                  r"AIDFirmwareUpdateUserClient",
                  r"validateFirmwareGated",
                  r"validateFirmware",
                  r"skipFWValidation",
                  r"_firmwareDescriptor",
                  r"_firmwareMap",
                  r"inputMD->prepare",
                  r"bufferLength must be",
                  r"classLength",
                  r"firmware.{0,45}(?:entitlement|privileg|bounds|length)",
              ],
              "Image4 and TXM argument handling": [
                  r"image4 dispatch: overflow",
                  r"overflow on range to be reclaimed from TXM",
                  r"unsupported AppleImage4 interface",
                  r"excessive return words from TXM",
                  r"invalid number of arguments to TXM",
                  r"Image4.{0,50}(?:overflow|bounds|length|argument)",
                  r"TXM.{0,50}(?:overflow|bounds|length|argument)",
              ],
              "User-client dispatch and validation": [
                  r"IOUserClient inputCount count mismatch",
                  r"IOUserClient outputCount count mismatch",
                  r"externalMethod.*(?:selector|count|invalid|entitlement)",
                  r"selector %d >= count %d",
                  r"no entitlement for selector",
                  r"user buffer exceeds maximum bounds",
                  r"user buffer length is zero",
                  r"user buffer is null",
                  r"copyin failed",
              ],
          }

          compiled = {
              name: [re.compile(p, re.IGNORECASE) for p in patterns]
              for name, patterns in categories.items()
          }

          report = [
              "iOS Kernel Second-Pass Static Triage",
              "=" * 40,
              f"Input: {source}",
              f"Input strings: {len(lines)}",
              "",
              "Target platform: iPhone 13 (iPhone14,5),",
              "iOS 27.0, build 24A437",
              "",
              "Interpretation warning:",
              "This report searches extracted strings, not executable control flow.",
              "A match does not prove a missing check, vulnerability, reachability,",
              "or exploitability. Reported indices refer to kernel-strings.txt,",
              "not source-code line numbers.",
          ]

          total_hits = 0

          for category, patterns in compiled.items():
              hits = []

              for index, line in enumerate(lines, start=1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append((index, line.strip()))

              total_hits += len(hits)

              unique_hits = []
              seen = set()

              for index, line in hits:
                  if line not in seen:
                      seen.add(line)
                      unique_hits.append((index, line))

              report.extend([
                  "",
                  "-" * 72,
                  category,
                  "-" * 72,
                  f"Matching string indices: {len(hits)}",
                  f"Unique matching strings: {len(unique_hits)}",
                  "",
              ])

              if not unique_hits:
                  report.append("No matches found.")
                  continue

              for index, line in unique_hits[:100]:
                  report.append(f"[string {index}] {line}")

              if len(unique_hits) > 100:
                  report.append(
                      f"... {len(unique_hits) - 100} additional unique "
                      "matches omitted."
                  )

          report.extend([
              "",
              "=" * 72,
              "Recommended next evidence",
              "=" * 72,
              "1. Identify the binary or driver associated with a lead.",
              "2. Inspect relevant executable functions and their callers.",
              "3. Determine whether untrusted input can reach the function.",
              "4. Examine bounds, arithmetic, object lifetime, and synchronization.",
              "5. Compare evidence with public advisories without assuming a CVE applies.",
              "",
              f"Raw regex matches across categories: {total_hits}",
          ])

          output.write_text("\n".join(report) + "\n")
          print(f"Created {output}")
          print(f"Report lines: {len(report)}")
          PY

      - name: Upload focused report
        uses: actions/upload-artifact@v4
        with:
          name: ios-second-pass-gpu-firmware
          path: reports/second-pass-gpu-firmware.txt
          if-no-files-found: error
          retention-days: 14
