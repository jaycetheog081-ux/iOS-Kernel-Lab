name: Analyze iOS Kernelcache

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the successful firmware inspection workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-kernel-lab-kernel-analysis
  cancel-in-progress: false

jobs:
  analyze:
    name: Decode and inspect kernelcache
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download existing kernel analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-kernel-analysis
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: input-artifact

      - name: Locate kernelcache
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="$(find input-artifact \
            -type f \
            -name 'kernelcache.release.iphone14' \
            -print -quit)"

          if [ -z "$KERNEL" ]; then
            echo "::error::Kernelcache not found in downloaded artifact."
            find input-artifact -maxdepth 5 -type f -print
            exit 1
          fi

          echo "kernel_path=$KERNEL" >> "$GITHUB_OUTPUT"

          echo "Found kernelcache:"
          ls -lh "$KERNEL"
          sha256sum "$KERNEL"

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail

          sudo snap install ipsw

          sudo apt-get update
          sudo apt-get install -y llvm file

          ipsw version || ipsw --version || true
          llvm-objdump --version
          llvm-nm --version

      - name: Prepare output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/kernel-analysis

      - name: Record original kernelcache fingerprint
        env:
          KERNEL_PATH: ${{ steps.locate.outputs.kernel_path }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "iOS Kernelcache Static Analysis"
            echo "================================"
            echo
            echo "Target: iPhone14,5"
            echo "Firmware: iOS 27.0"
            echo "Build: 24A437"
            echo
            echo "Original kernelcache:"
            echo "$KERNEL_PATH"
            echo
            echo "File size:"
            stat -c '%s bytes' "$KERNEL_PATH"
            echo
            echo "SHA-256:"
            sha256sum "$KERNEL_PATH"
            echo
            echo "File type:"
            file "$KERNEL_PATH"
            echo
            echo "First 32 bytes:"
            od -An -tx1 -N32 "$KERNEL_PATH"
          } > reports/kernel-analysis/kernelcache-report.txt

      - name: Decompress kernelcache
        id: decompress
        env:
          KERNEL_PATH: ${{ steps.locate.outputs.kernel_path }}
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="reports/kernel-analysis/kernelcache.dec"
          mkdir -p "$OUTPUT_DIR"

          ipsw kernel dec "$KERNEL_PATH" --output "$OUTPUT_DIR"

          DECODED="$(find "$OUTPUT_DIR" \
            -type f \
            -name '*.decompressed' \
            -print -quit)"

          if [ -z "$DECODED" ]; then
            echo "::error::No decompressed kernel file was found."
            find "$OUTPUT_DIR" -maxdepth 4 -print
            exit 1
          fi

          if [ ! -s "$DECODED" ]; then
            echo "::error::The decompressed kernel file is empty."
            exit 1
          fi

          echo "decoded_path=$DECODED" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "DECOMPRESSION"
            echo "-------------"
            echo "Status: completed"
            echo "Output: $DECODED"
            echo
            echo "Size:"
            stat -c '%s bytes' "$DECODED"
            echo
            echo "SHA-256:"
            sha256sum "$DECODED"
            echo
            echo "File type:"
            file "$DECODED"
            echo
            echo "First 32 bytes:"
            od -An -tx1 -N32 "$DECODED"
          } >> reports/kernel-analysis/kernelcache-report.txt

      - name: Extract kernel version metadata
        if: steps.decompress.outcome == 'success'
        env:
          DECODED_PATH: ${{ steps.decompress.outputs.decoded_path }}
        shell: bash
        run: |
          set -euo pipefail

          if ipsw kernel version --help 2>&1 | grep -q -- '--json'; then
            ipsw kernel version "$DECODED_PATH" --json \
              > reports/kernel-analysis/kernel-version.json
          else
            ipsw kernel version "$DECODED_PATH" \
              > reports/kernel-analysis/kernel-version.txt
          fi

          {
            echo
            echo "KERNEL VERSION METADATA"
            echo "-----------------------"

            if [ -f reports/kernel-analysis/kernel-version.json ]; then
              cat reports/kernel-analysis/kernel-version.json
            else
              cat reports/kernel-analysis/kernel-version.txt
            fi
          } >> reports/kernel-analysis/kernelcache-report.txt

      - name: Collect readable kernel strings
        if: steps.decompress.outcome == 'success'
        env:
          DECODED_PATH: ${{ steps.decompress.outputs.decoded_path }}
        shell: bash
        run: |
          set -euo pipefail

          strings -a -n 8 "$DECODED_PATH" \
            > reports/kernel-analysis/kernel-strings.txt

          {
            echo
            echo "STRING SCAN"
            echo "-----------"
            echo "Total extracted strings:"
            wc -l < reports/kernel-analysis/kernel-strings.txt
            echo
            echo "Selected kernel/version/security-related strings:"
            grep -Ei \
              'Darwin Kernel Version|xnu-|sandbox|AMFI|AppleMobileFileIntegrity|pmap|mach_trap|codesign|entitlement|IOMobileFramebuffer' \
              reports/kernel-analysis/kernel-strings.txt \
              | head -n 200 || true
          } >> reports/kernel-analysis/kernelcache-report.txt

      - name: Inspect Mach-O headers and sections
        if: steps.decompress.outcome == 'success'
        env:
          DECODED_PATH: ${{ steps.decompress.outputs.decoded_path }}
        shell: bash
        run: |
          set -uo pipefail

          OUT="reports/kernel-analysis/kernel-mach-o-info.txt"

          {
            echo "Mach-O Kernel Inspection"
            echo "========================"
            echo
            echo "Input: $DECODED_PATH"
            echo
            echo "File identification:"
            file "$DECODED_PATH"
            echo
            echo "Architecture and load commands:"
          } > "$OUT"

          if llvm-objdump --macho --private-headers \
              "$DECODED_PATH" >> "$OUT" 2>&1; then
            echo "Mach-O header inspection completed."
          else
            {
              echo
              echo "The installed LLVM could not parse this file directly."
              echo "This may require a Mach-O fileset-aware parser."
            } >> "$OUT"
          fi

          {
            echo
            echo "Section listing:"
          } >> "$OUT"

          llvm-objdump --macho --section-headers \
            "$DECODED_PATH" >> "$OUT" 2>&1 || true

          echo "Created $OUT"

      - name: Extract available symbols
        if: steps.decompress.outcome == 'success'
        env:
          DECODED_PATH: ${{ steps.decompress.outputs.decoded_path }}
        shell: bash
        run: |
          set -uo pipefail

          OUT="reports/kernel-analysis/kernel-symbols.txt"
          FOCUSED="reports/kernel-analysis/kernel-focused-symbols.txt"

          {
            echo "Kernel Symbol Inspection"
            echo "========================"
            echo
            echo "Input: $DECODED_PATH"
            echo
            echo "Symbols depend on whether the binary retains a usable symbol table."
            echo "An empty result does not establish that a function is absent."
            echo
          } > "$OUT"

          if llvm-nm --defined-only "$DECODED_PATH" \
              >> "$OUT" 2>&1; then
            echo "LLVM symbol extraction completed."
          else
            {
              echo
              echo "LLVM could not extract symbols directly."
              echo "The kernel may be stripped or use a format requiring"
              echo "additional fileset-aware analysis."
            } >> "$OUT"
          fi

          {
            echo "Focused GPU and firmware symbol candidates"
            echo "=========================================="
            echo
            echo "Candidates found in extracted symbol output:"
            echo
          } > "$FOCUSED"

          grep -Ei \
            'AGXFirmwareRingValidator|AGXArmFirmwareMapper|AGXAcceleratorRing|AGXSecureGart|AppleFirmwareUpdateUserClient|AIDFirmwareUpdateUserClient|Image4|IOUserClient' \
            "$OUT" >> "$FOCUSED" || true

          if [ "$(wc -l < "$FOCUSED")" -le 6 ]; then
            {
              echo
              echo "No matching symbol names were recovered."
              echo "This can occur when symbols are stripped or stored separately."
            } >> "$FOCUSED"
          fi

          echo "Created $OUT"
          echo "Created $FOCUSED"

      - name: Create inspection summary
        if: always()
        shell: bash
        run: |
          set -u

          OUT="reports/kernel-analysis/inspection-summary.txt"

          {
            echo "Kernel Inspection Summary"
            echo "========================="
            echo
            echo "Target: iPhone 13 (iPhone14,5)"
            echo "Firmware: iOS 27.0"
            echo "Build: 24A437"
            echo
            echo "This workflow performs static inspection only."
            echo "It does not establish that a vulnerability exists."
            echo
            echo "Generated files:"
            if [ -d reports/kernel-analysis ]; then
              find reports/kernel-analysis \
                -maxdepth 4 \
                -type f \
                -printf '%p (%s bytes)\n' | sort
            fi
          } > "$OUT"

          cat "$OUT"

      - name: Show output summary
        if: always()
        shell: bash
        run: |
          echo "Generated analysis files:"
          if [ -d reports/kernel-analysis ]; then
            find reports/kernel-analysis \
              -maxdepth 4 \
              -type f \
              -printf '%p (%s bytes)\n'
          fi

      - name: Upload kernel analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-kernel-static-analysis
          path: reports/kernel-analysis/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
