name: Inspect iOS Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-kernel-lab-firmware-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Extract and fingerprint kernelcache
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check available disk space
        run: |
          echo "Disk space before download:"
          df -h
          echo
          echo "Target: iPhone14,5 / iOS 27.0 / 24A437"

      - name: Download IPSW and extract kernelcache
        run: python scripts/inspect_ipsw.py

      - name: Show analysis summary
        if: always()
        run: |
          echo "Generated reports:"
          if [ -d reports ]; then
            find reports -maxdepth 3 -type f -printf '%p (%s bytes)\n'
          else
            echo "No reports directory was created."
          fi

      - name: Upload kernel analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-kernel-analysis
          path: |
            reports/kernel-analysis.txt
            reports/kernel-analysis.json
            reports/kernelcache/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
